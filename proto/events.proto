syntax = "proto3";

package lattice;

option go_package = "lattice/proto";

import "proto/frames.proto";

// System events published by the server to lattice.system.entity.*.
// These bypass schema validation — they are server-generated and trusted.

message EntityJoined {
    bytes           pubkey       = 1; // Ed25519 public key (32 bytes)
    repeated Capability capabilities = 2; // typed capabilities declared at HELLO time
    string          session_id   = 3;
}

message EntityLeft {
    bytes  pubkey     = 1;
    string session_id = 2;
}

message EntityOffline {
    bytes  pubkey     = 1;
    string session_id = 2;
}
