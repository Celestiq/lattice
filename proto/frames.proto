syntax = "proto3";

package lattice;

option go_package = "lattice/proto";

// ─── Frame type enum ────────────────────────────────────────────────────────
// All 14 frame types used across sessions 1–7.
enum FrameType {
  FRAME_TYPE_UNKNOWN      = 0;
  FRAME_TYPE_HELLO        = 1;
  FRAME_TYPE_HELLO_ACK    = 2;
  FRAME_TYPE_HEARTBEAT    = 3;
  FRAME_TYPE_HEARTBEAT_ACK = 4;
  FRAME_TYPE_SUBSCRIBE    = 5;
  FRAME_TYPE_UNSUBSCRIBE  = 6;
  FRAME_TYPE_PUBLISH      = 7;
  FRAME_TYPE_DELIVER      = 8;
  FRAME_TYPE_ERROR        = 9;
  FRAME_TYPE_REQUEST      = 10;
  FRAME_TYPE_RESPONSE     = 11;
  FRAME_TYPE_DISCONNECT   = 12;
  FRAME_TYPE_PING         = 13;
  FRAME_TYPE_PONG         = 14;
}

// ─── Session 1: raw echo (no semantic payload yet) ───────────────────────────

message RawFrame {
  bytes payload = 1;
}

// ─── Session 2: HELLO / HELLO_ACK / HEARTBEAT ────────────────────────────────

message Hello {
  bytes  pubkey    = 1; // Ed25519 public key (32 bytes)
  bytes  signature = 2; // Ed25519 signature over TLS-exporter nonce (64 bytes)
  repeated string capabilities = 3;
}

message HelloAck {
  string session_id         = 1;
  bytes  session_token      = 2; // 32 random bytes
  bytes  server_pubkey      = 3; // Ed25519 public key (32 bytes)
  uint32 heartbeat_interval = 4; // seconds
}

message Heartbeat {}

message HeartbeatAck {}

// ─── Session 3: channel pub/sub ──────────────────────────────────────────────

message Subscribe {
  string subject = 1;
}

message Unsubscribe {
  string subject = 1;
}

message Publish {
  string subject = 1;
  bytes  payload = 2;
}

message Deliver {
  string subject = 1;
  bytes  payload = 2;
}

// ─── Session 7: call primitive ───────────────────────────────────────────────

message Request {
  string correlation_id = 1;
  bytes  target_pubkey  = 2; // Ed25519 public key of target entity (32 bytes)
  bytes  payload        = 3;
  uint32 timeout_ms     = 4;
}

message Response {
  string correlation_id = 1;
  bytes  payload        = 2;
}

// ─── Error / disconnect / ping-pong ──────────────────────────────────────────

message Error {
  string code    = 1;
  string message = 2;
}

message Disconnect {
  string reason = 1;
}

message Ping {
  bytes nonce = 1;
}

message Pong {
  bytes nonce = 1;
}
