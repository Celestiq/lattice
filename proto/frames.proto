syntax = "proto3";

package lattice;

option go_package = "lattice/proto";

// ─── Frame type enum ────────────────────────────────────────────────────────
// Values 0–14: client↔server frames (TLS-over-TCP connections).
// Values 15–23: federation frames (QUIC peer connections only; never on client connections).
enum FrameType {
  FRAME_TYPE_UNKNOWN      = 0;
  FRAME_TYPE_HELLO        = 1;
  FRAME_TYPE_HELLO_ACK    = 2;
  FRAME_TYPE_HEARTBEAT    = 3;
  FRAME_TYPE_HEARTBEAT_ACK = 4;
  FRAME_TYPE_SUBSCRIBE    = 5;
  FRAME_TYPE_UNSUBSCRIBE  = 6;
  FRAME_TYPE_PUBLISH      = 7;
  FRAME_TYPE_DELIVER      = 8;
  FRAME_TYPE_ERROR        = 9;
  FRAME_TYPE_REQUEST      = 10;
  FRAME_TYPE_RESPONSE     = 11;
  FRAME_TYPE_DISCONNECT   = 12;
  FRAME_TYPE_PING         = 13; // Reserved — no handler; do not build client code against this
  FRAME_TYPE_PONG         = 14; // Reserved — no handler; do not build client code against this

  // Federation frames — QUIC peer connections only (v0.2+)
  FRAME_TYPE_FED_HELLO     = 15;
  FRAME_TYPE_FED_HELLO_ACK = 16;
  FRAME_TYPE_FED_REJECT    = 17;
  FRAME_TYPE_FED_PENDING   = 18;
  FRAME_TYPE_FED_POLICY    = 19;
  FRAME_TYPE_FED_STATUS    = 20;
  FRAME_TYPE_FED_DELIVER   = 21;
  FRAME_TYPE_FED_REQUEST   = 22;
  FRAME_TYPE_FED_RESPONSE  = 23;
}

// ─── Session 1, Decision #7: typed capability descriptor ────────────────────

message Capability {
  string name = 1; // capability identifier e.g. "sensor", "actuator"
}

// ─── Session 1: HELLO / HELLO_ACK / HEARTBEAT ────────────────────────────────

message Hello {
  bytes  pubkey           = 1; // Ed25519 public key (32 bytes)
  bytes  signature        = 2; // Ed25519 signature over client TLS-exporter nonce (64 bytes)
  repeated Capability capabilities     = 3;
  uint32 protocol_version = 4; // must equal ProtocolVersion=1; server rejects mismatches
  bytes  resume_token     = 5; // optional; 32-byte token from a prior HELLO_ACK (Decision #2)
}

message HelloAck {
  string session_id         = 1;
  bytes  session_token      = 2; // 32 random bytes
  bytes  server_pubkey      = 3; // Ed25519 public key (32 bytes)
  uint32 heartbeat_interval = 4; // seconds
  bytes  server_signature   = 5; // Ed25519 signature over server TLS-exporter nonce (64 bytes)
}

message Heartbeat {}

message HeartbeatAck {}

// ─── Session 3: channel pub/sub ──────────────────────────────────────────────

message Subscribe {
  string subject = 1;
}

message Unsubscribe {
  string subject = 1;
}

message Publish {
  string subject    = 1;
  bytes  payload    = 2;
  string message_id = 3; // client-assigned; echoed in Error.ref_id on failure (Decision #5)
}

message Deliver {
  string subject             = 1;
  bytes  payload             = 2;
  uint64 id                  = 3; // per-subject monotonic counter, server-assigned (Decision #4)
  string publisher_identity  = 4; // base32 pubkey of publisher, server-stamped (Decision #4)
  int64  published_at        = 5; // Unix milliseconds, server timestamp (Decision #4)
  uint32 schema_version      = 6; // from schema registry; 0 if no registered schema (Decision #4)
}

// ─── Session 7: call primitive ───────────────────────────────────────────────

message Request {
  string correlation_id  = 1;
  bytes  target_pubkey   = 2; // Ed25519 public key of target entity (32 bytes)
  bytes  payload         = 3;
  uint32 timeout_ms      = 4;
  string caller_identity = 5; // base32 pubkey of requester, server-stamped; client-supplied value is overwritten (Decision #18)
  int64  received_at     = 6; // Unix milliseconds, server timestamp (Decision #18)
}

message Response {
  string correlation_id = 1;
  bytes  payload        = 2;
}

// ─── Error / disconnect / ping-pong ──────────────────────────────────────────

message Error {
  string code    = 1;
  string message = 2;
  string ref_id  = 3; // echoes Publish.message_id on publish errors, or correlation_id on call timeout (Decision #5)
}

message Disconnect {
  string reason = 1;
}

message Ping {
  bytes nonce = 1;
}

message Pong {
  bytes nonce = 1;
}
