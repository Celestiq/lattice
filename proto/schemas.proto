syntax = "proto3";

package lattice;

option go_package = "lattice/proto";

import "proto/lattice_options.proto";

// TemperatureReading is published to home.sensor.temperature.
// value is required; range -50.0 .. 150.0 °C.
// unit is optional; max 10 chars.
message TemperatureReading {
  optional float  value = 1 [(lattice.range) = {min: -50.0, max: 150.0}, (lattice.required) = true];
  optional string unit  = 2 [(lattice.max_length) = 10];
}

// LightAction is the valid command set for home.light.command.
enum LightAction {
  LIGHT_ACTION_UNSPECIFIED = 0;
  LIGHT_ACTION_ON          = 1;
  LIGHT_ACTION_OFF         = 2;
  LIGHT_ACTION_TOGGLE      = 3;
}

// LightCommand is published to home.light.command.
// action is required (ON/OFF/TOGGLE, range 1..3); brightness is optional (0.0..1.0).
message LightCommand {
  optional LightAction action     = 1 [(lattice.range) = {min: 1.0, max: 3.0}, (lattice.required) = true];
  optional float       brightness = 2 [(lattice.range) = {min: 0.0, max: 1.0}];
}
